name: docker-images

on:
  push:
    branches: [new-reap-mcts-ttt-public]
    paths: ["docker/**", "app/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-lean-reap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      - name: Build & push reap-lean (MCTS-v1, CPU image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/reap-lean.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/reap-lean:4.28.0-rc1-reap
            ghcr.io/${{ github.repository_owner }}/reap-lean:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      - name: Build & push reap-train (GPU image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/train.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/reap-train:1.0
            ghcr.io/${{ github.repository_owner }}/reap-train:latest
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple/
          cache-from: type=gha
          cache-to: type=gha,mode=max
